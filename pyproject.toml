[project]
name = "mustafatron"
version = "0.2.0"
description = "League hub for Mustafa Greene's Fan Club: ESPN fantasy football history, reports and keepers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "requests>=2.32",
    "truststore>=0.10",
]

[project.optional-dependencies]
# Only needed by the ported v1 report code in mustafatron.legacy, which is
# rewritten on raw requests + client-side charts in M1/M4 and then removed.
legacy = [
    "espn-api>=0.39",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mustafatron"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Carried over as-is and restructured in M1/M4; linting them now would just churn the diff.
extend-exclude = ["src/mustafatron/legacy", "scratch_h2h.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
