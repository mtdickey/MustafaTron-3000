# League rules that ESPN does not model. Loaded by src/mustafatron/rules.py.
#
# Anything ESPN knows comes from its mSettings view (src/mustafatron/league_settings.py) and must
# NOT be repeated here: team count, lineup slots, regular season length and last week, playoff team
# count, scoring, keeper count, trade deadline.
#
# A rule that has changed over time is a list of {since: <season>, value: ...}; for a given season
# the entry with the latest `since` at or before it applies. Rules that never changed are plain values.
#
# Deliberately left out: the fantasy-war replacement levels ({QB: 20, RB: 57, WR: 48, TE: 20}),
# which belong to code that is not being ported.

# First season of all-time history (H2H, records). The league's ESPN history starts here.
history_start: 2015

# Net return on the buy-in by final rank, in multiples of the buy-in. 1st takes home 6.5 buy-ins and
# 2nd 2.5 (nets +5.5 and +1.5 once their own buy-in is counted), 3rd gets the buy-in back (0), and
# every other rank loses it (-1). The pot balances: 6.5 + 2.5 + 1 = 10 buy-ins from 10 teams, so the
# league nets exactly 0 each season (tests/test_stats.py). roi-calculations.ipynb wrote the
# take-home amounts, {1: 6.5, 2: 2.5, 3: 0, 4: -1}, mixed in with net ones.
payouts:
  - since: 2015
    value:
      by_rank: {1: 5.5, 2: 1.5, 3: 0.0}
      otherwise: -1.0

# Keepers (issue #40, settled November 2026). How many each team keeps is ESPN's keeperCount (3 from
# 2024). Applied by src/mustafatron/keeper_engine.py; the worked examples below are its tests
# (tests/test_keeper_engine.py), all real keepers from data/manual/keeper_history.yml.
#
#   eligible_after_round  A player can be kept only if the round he went in last season's draft, as a
#                         keeper or not, was later than this. Undrafted players (waiver and free agent
#                         pickups) can't be kept.
#   rounds_earlier        He costs last season's round minus this. So a keeper moves up a round every
#                         year, and can cost round 3 at the earliest, never rounds 1-2.
#   max_consecutive       He can be kept at most this many seasons in a row, by anyone: the count
#                         follows him through a trade. A season back in the draft resets it.
#   Collisions            Keepers that would cost the same round can't share it. The manager chooses
#                         which one stays; each other moves to the latest free round before it (so
#                         two from one round take it and the one before, three take it and the two
#                         before). The rounds a manager's keepers end up in are the picks he forfeits.
#
# Worked examples:
#   Nico Collins     drafted round 14 in 2023; kept 2024 (round 13), 2025 (12), 2026 (11). That is
#                    3 straight seasons, so he can't be kept in 2027.
#   Lamar Jackson    drafted round 5 in 2023; kept 2024 (round 4), 2025 (round 3). His 2025 round was
#                    3, so he couldn't be kept in 2026.
#   Drake London     kept by Jon in 2024 and 2025, by Dylan in 2026 (keeper rights traded): 3 straight
#                    seasons, so nobody can keep him in 2027.
#   Zay Flowers      kept in 2024, back in the 2025 draft (round 6), kept in 2026 at round 5: year 1
#                    again, so he can be kept in 2027 and 2028.
#   George Pickens   in 2024 he and Zay Flowers were both from 2023's round 9, so both cost round 8.
#                    Flowers stayed in round 8 and Pickens moved to round 7.
keepers:
  - since: 2024
    value:
      eligible_after_round: 3
      rounds_earlier: 1
      max_consecutive: 3

# Draft review (the weekly report and /draft): a steal is a pick after round 1, a bust a pick in rounds 1-4.
draft_review:
  steals_after_round: 1
  busts_through_round: 4

# Rivalries and the "notable" flags on H2H previews (scratch_h2h.py, scratch-biggest-rivals.ipynb).
rivalry:
  min_matchups: 5          # meetings needed to count as a rivalry
  notable_min_games: 3     # fewer meetings than this and nothing is flagged
  streak: 3                # flag a current winning streak of at least this many
  lopsided_pct: 0.70       # flag a series one side wins at least this share of
  dead_even_max_diff: 1    # flag |wins - losses| <= this ...
  dead_even_min_games: 5   # ... once there have been at least this many meetings

# Kickoff of each season's first NFL game (UTC), from ESPN's NFL scoreboard. NFL week N starts
# (N - 1) * 7 days after this, and a roster move counts from the first week that starts after it.
# This replaces the hand-typed season_start_date, which disagreed with itself in 2025
# (Sept 4 in one notebook cell, Sept 7 in another). Sept 4 was right: Sept 7 was the first Sunday.
# Trades no longer use this: since M3 a trade counts from the first week its players were on their
# new rosters (mustafatron.transform.infer_trades). Kept as reference: rules.first_week_after.
nfl_week1_kickoff:
  2015: 2015-09-11T00:30:00Z
  2016: 2016-09-09T00:30:00Z
  2017: 2017-09-08T00:30:00Z
  2018: 2018-09-07T00:55:00Z
  2019: 2019-09-06T00:20:00Z
  2020: 2020-09-11T00:20:00Z
  2021: 2021-09-10T00:20:00Z
  2022: 2022-09-09T00:20:00Z
  2023: 2023-09-08T00:20:00Z
  2024: 2024-09-06T00:40:00Z
  2025: 2025-09-05T00:20:00Z
  2026: 2026-09-10T00:20:00Z  # a Wednesday night opener

# The league's awards. Each names a metric computed in src/mustafatron/stats/awards.py, from the
# first season the data supports it (`since`); data/manual/awards.yml records winners by hand for
# seasons before that, or overrides a computed one. Until now these lived only in GroupMe captions,
# so the criteria below are this file's reading of them, to be confirmed with the league:
#   status: official  - an award the league already gives
#   status: proposed  - suggested here, shown on the site as proposed until the league adopts it
awards:
  - id: kariuki
    name: The Richard Kariuki Award
    description: The biggest fleece of the season. Goes to the manager on the wrong end of the season's worst trade, by rest-of-season value to their best lineups.
    metric: worst_trade
    status: official
    since: 2018
  - id: grudee
    name: The Jon Grudee Award
    description: The trade of the year. Goes to the manager whose trade added the most rest-of-season value to their best lineups.
    metric: best_trade
    status: official
    since: 2018
  - id: coach
    name: Coach of the Year
    description: Fewest points left on the bench over the regular season, against the best lineup each week.
    metric: fewest_bench_points
    status: official
    since: 2018
  - id: horseshoe
    name: The Golden Horseshoe
    description: The luckiest record of the season. The regular season record furthest above the team's all-play rate (ranked by win pct, so a 14-game season has no edge).
    metric: luckiest
    status: proposed
    since: 2015
  - id: snakebit
    name: Snakebit
    description: The unluckiest record of the season. The regular season record furthest below the team's all-play rate (ranked by win pct).
    metric: unluckiest
    status: proposed
    since: 2015
