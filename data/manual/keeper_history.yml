# Every player kept, by season. Loaded by src/mustafatron/keepers.py.
#
# The league has kept players since 2024 (ESPN keeperCount 3 from then, 0 before), so this is the
# whole history. Source: the commissioner's "Mustafa Greene's Keeper Selections {season}" Google
# Sheets (the Selections tab), checked against ESPN:
#
#   2024, 2025  ESPN flags keeper picks in mDraftDetail (data/raw/{season}/draft.json), and
#               tests/test_keepers.py requires this file to match those picks exactly: same players,
#               same manager, same round. ESPN wins where it and the sheet disagree (notes below).
#   2026        From the 2026 sheet. The 2026 draft is not in data/raw/ until the season finishes,
#               and the test checks it against ESPN then.
#
# Each season maps a canonical manager id (data/manual/managers.yml) to the players they kept:
#
#   player     name as ESPN shows it (for reading this file; player_id is the key)
#   player_id  ESPN player id; negative for a team defense
#   round      the draft round the keeper took that season: one earlier than the round he was
#              drafted in the season before, unless a collision moved it (see note)
#   via        optional: the manager who traded the player's keeper rights to this one in the
#              offseason. He was on that manager's roster when the season before ended.
#   note       optional, free text
#
# Fixing a mistake is an edit here, never a code change.

seasons:
