# Canonical managers of Mustafa Greene's Fan Club: one entry per person, across every season.
#
# Everything downstream (H2H, standings, records, keepers) keys on the canonical `id` here, never on
# an ESPN member ID, because one person can have several ESPN accounts and ESPN's names are
# inconsistently cased. Resolution lives in src/mustafatron/identity.py.
#
#   id          stable slug, used in URLs and published JSON. Never change one once published.
#   name        display name
#   short_name  label for charts and tight tables; unique across the league's history
#   espn_ids    every ESPN member ID this person has owned a team under. These are the pseudonymized
#               IDs from data/raw/ (m_ + 16 hex, see mustafatron.pseudonymize), never raw SWIDs.
#   aliases     other spellings of the name ESPN has shown (matched case-insensitively)
#   seasons     "2015-2025" or "2016-" (still active) or "2015"
#
# A new ESPN member ID showing up fails tests/test_identity.py until it is added here, so a
# duplicate account can't quietly split someone's career in the record book.

managers:
  albert:
    name: Matthew Albert
    short_name: Matt A.
    espn_ids: [m_a4f0d563b98b1fb1]
    seasons: 2015-

  alligood:
    name: Brian Alligood
    short_name: Brian
    espn_ids: [m_f7ab1cd7c6fe24b0]
    seasons: 2026-

  carpenter:
    name: Matthew Carpenter
    short_name: Matt C.
    espn_ids: [m_f90f2363985047cb]
    seasons: 2016-

